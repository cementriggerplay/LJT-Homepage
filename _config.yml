# Site settings for Junteng Liu's personal homepage (Academic Pages template)

# Basic Site Settings
locale                   : "en-US"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : "Junteng Liu"
description              : "Junteng Liu is a first-year Ph.D. candidate at the HKUST NLP Group, researching natural language processing and machine learning."
url                      : https://cementriggerplay.github.io/LJT-Homepage
baseurl                  : ""
repository               : "cementriggerplay/LJT-Homepage"

# Site Author - shown in the sidebar (icons/links only appear when the field is filled)
author:
  name             : "Junteng Liu"
  bio              : "First-year Ph.D. candidate in the HKUST NLP Group at the Hong Kong University of Science and Technology (HKUST). His research focuses on natural language processing and machine learning; his research interests include LLM reasoning and reinforcement learning, hallucination in Vision-Language Models (VLMs), and LLM truthfulness and interpretability."
  employer         : "Hong Kong University of Science and Technology"
  email            : "jliugi@connect.ust.hk"
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github           : "Vicent0205"
  twitter          : "junteng88716710"

# Publication categories and headings on the Publications page
publication_category:
  manuscripts:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

# Files/directories to include in the site build
include:
  - _pages
  - files

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Default front matter for pages and publications
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

# Markdown Processing
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML Compression
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
